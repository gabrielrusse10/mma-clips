<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MMA Clips — Recent Highlights</title>
    <meta
      name="description"
      content="Recent knockouts, submissions and fight highlights from UFC, ONE, PFL, Bellator and more. Updated daily."
    />
    <meta name="theme-color" content="#0b0c0f" />
    <meta property="og:title" content="MMA Clips — Recent Highlights" />
    <meta
      property="og:description"
      content="Recent knockouts, submissions and fight highlights from the major MMA promotions. Updated daily."
    />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e11d2e'/%3E%3Cpath d='M13 9.5v13l10-6.5z' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#results">Skip to highlights</a>

    <header class="masthead">
      <div class="masthead__inner">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div>
            <h1 class="brand__name">MMA Clips</h1>
            <p class="brand__tag">Knockouts, submissions and finishes from the last few weeks</p>
          </div>
        </div>
        <div class="freshness">
          <span class="freshness__dot" aria-hidden="true"></span>
          <span id="updated-label">Loading…</span>
        </div>
      </div>
    </header>

    <main>
      <section class="controls" aria-label="Filters">
        <div class="controls__row">
          <div class="search">
            <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M9 3a6 6 0 104.47 10.03l3.25 3.25 1.06-1.06-3.25-3.25A6 6 0 009 3zm0 1.5a4.5 4.5 0 110 9 4.5 4.5 0 010-9z"
                fill="currentColor"
              />
            </svg>
            <input
              id="search"
              type="search"
              placeholder="Search fighters, events, finishes…"
              autocomplete="off"
              aria-label="Search highlights"
            />
          </div>
          <label class="sort">
            <span>Sort</span>
            <select id="sort" aria-label="Sort highlights">
              <option value="rank">Trending</option>
              <option value="newest">Newest</option>
              <option value="views">Most viewed</option>
            </select>
          </label>
        </div>
        <div class="chips" id="promotions" role="group" aria-label="Filter by promotion"></div>
      </section>

      <section id="results" class="results" aria-live="polite" aria-busy="true">
        <div class="grid" id="grid"></div>
        <p class="status" id="status">Loading highlights…</p>
      </section>
    </main>

    <footer class="footer">
      <p>
        Clips are embedded from the promotions' official YouTube channels. All rights belong to their
        respective owners. Rebuilt automatically every day.
      </p>
    </footer>

    <div class="player" id="player" hidden>
      <div class="player__backdrop" data-close></div>
      <div class="player__panel" role="dialog" aria-modal="true" aria-labelledby="player-title">
        <button class="player__close" type="button" data-close aria-label="Close player">×</button>
        <div class="player__frame" id="player-frame"></div>
        <div class="player__meta">
          <h2 id="player-title"></h2>
          <p id="player-sub"></p>
          <a id="player-link" class="player__link" target="_blank" rel="noopener noreferrer">
            Watch on YouTube ↗
          </a>
        </div>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
